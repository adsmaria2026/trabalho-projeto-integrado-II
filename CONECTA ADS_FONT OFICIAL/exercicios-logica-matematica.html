
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios - Lógica e Matemática Computacional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>Conecta <span>ADS</span></h2>
            <nav>
                <a href="index.html">🏠 Início</a>
                <a href="estudos.html" class="active">📚 Estudos</a>
                <a href="trabalhos.html">📄 Trabalhos</a>
                <a href="quiz.html">📝 Quiz</a>
                <a href="perfil.html">👤 Meu perfil</a>
            </nav>
            <div class="sidebar-bottom">
                <a href="#">⚙️ Configurações</a>
                <a href="login.html">🚪 Sair</a>
            </div>
        </aside>

        <main class="main-content">
            <header>
                <div>
                    <h1>Exercícios - Lógica e Matemática Computacional 🧠</h1>
                    <p>Pratique os conteúdos da disciplina.</p>
                </div>
                <div class="profile">👤</div>
            </header>

            <section class="section">
                <h2>Questões</h2>
                <div id="lista-questoes">
                    <p>Carregando questões...</p>
                </div>
            </section>
        </main>
    </div>

    <script>
        async function carregarQuestoes() {
            const lista = document.getElementById("lista-questoes");

            try {
                const resposta = await fetch("/api/perguntas-quiz/2");

                if (!resposta.ok) {
                    throw new Error("Erro ao buscar questões.");
                }

                const perguntas = await resposta.json();
                lista.innerHTML = "";

                if (perguntas.length === 0) {
                    lista.textContent = "Nenhuma questão cadastrada ainda.";
                    return;
                }

                perguntas.forEach((pergunta, indice) => {
                    const card = document.createElement("div");
                    card.className = "material";

                    const titulo = document.createElement("h3");
                    titulo.textContent =
                        (indice + 1) + ". " + pergunta.enunciado;

                    card.appendChild(titulo);

                    const alternativas = [
                        ["A", pergunta.alternativa_a],
                        ["B", pergunta.alternativa_b],
                        ["C", pergunta.alternativa_c],
                        ["D", pergunta.alternativa_d]
                    ];

                    alternativas.forEach(([letra, texto]) => {
                        const label = document.createElement("label");

                        label.style.display = "block";
                        label.style.margin = "10px 0";
                        label.style.cursor = "pointer";

                        const radio = document.createElement("input");
                        radio.type = "radio";
                        radio.name = "questao-" + pergunta.id_pergunta;
                        radio.value = letra;

                        label.appendChild(radio);
                        label.appendChild(
                            document.createTextNode(" " + letra + ") " + texto)
                        );

                        card.appendChild(label);
                    });

                    const botao = document.createElement("button");
                    botao.type = "button";
                    botao.textContent = "Conferir resposta";

                    const resultado = document.createElement("p");

                    botao.addEventListener("click", async () => {
                        const selecionada = card.querySelector(
                            'input[name="questao-' +
                            pergunta.id_pergunta +
                            '"]:checked'
                        );

                        if (!selecionada) {
                            resultado.textContent =
                                "Selecione uma alternativa primeiro.";
                            return;
                        }

                        botao.disabled = true;
                        botao.textContent = "Conferindo...";
                        resultado.textContent = "";

                        try {
                            const respostaConferencia = await fetch(
                                "/api/conferir-resposta",
                                {
                                    method: "POST",
                                    headers: {
                                        "Content-Type": "application/json"
                                    },
                                    body: JSON.stringify({
                                        id_pergunta: pergunta.id_pergunta,
                                        alternativa_escolhida: selecionada.value
                                    })
                                }
                            );

                            const dados = await respostaConferencia.json();

                            if (!respostaConferencia.ok) {
                                throw new Error(
                                    dados.mensagem ||
                                    "Não foi possível conferir a resposta."
                                );
                            }

                            if (dados.correta) {
                                resultado.textContent =
                                    "Correto! 🎉 " + dados.explicacao;
                            } else {
                                resultado.textContent =
                                    "Resposta incorreta. Tente revisar o conteúdo. " +
                                    dados.explicacao;
                            }

                            card.querySelectorAll("input").forEach((radio) => {
                                radio.disabled = true;
                            });
                        } catch (erro) {
                            resultado.textContent =
                                erro.message ||
                                "Erro ao conferir. Verifique se o servidor está ligado.";

                            botao.disabled = false;
                        } finally {
                            botao.textContent = "Resposta conferida";
                        }
                    });

                    card.appendChild(botao);
                    card.appendChild(resultado);
                    lista.appendChild(card);
                });
            } catch (erro) {
                console.error(erro);

                lista.textContent =
                    "Não foi possível carregar as questões. " +
                    "Verifique se o servidor está ligado.";
            }
        }

        carregarQuestoes();
    </script>
</body>
</html>
