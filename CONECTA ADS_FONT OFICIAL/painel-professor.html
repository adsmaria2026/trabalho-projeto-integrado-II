
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor - Conecta ADS</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .professor-page .professor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .professor-page .professor-header h1 {
            margin-bottom: 8px;
        }

        .professor-page .professor-header p {
            color: #687386;
            margin: 0;
        }

        .professor-page .profile {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #eaf1ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
        }

        .professor-page .professor-section {
            margin-bottom: 30px;
        }

        .professor-page .professor-section > h2 {
            font-size: 21px;
            margin-bottom: 16px;
            color: #173b75;
        }

        .professor-page .work-container {
            background: #fff;
            border-radius: 14px;
            padding: 28px;
            border: 1px solid #e5eaf2;
            border-left: 5px solid #f28c28;
            box-shadow: 0 4px 15px rgba(20, 45, 80, 0.06);
        }

        .professor-page form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .professor-page form label {
            font-weight: 600;
            color: #34445d;
            margin-top: 8px;
        }

        .professor-page form input,
        .professor-page form select,
        .professor-page form textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #d7deea;
            border-radius: 8px;
            background: #fff;
            color: #263449;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        .professor-page form input:focus,
        .professor-page form select:focus,
        .professor-page form textarea:focus {
            border-color: #2864bd;
            box-shadow: 0 0 0 3px rgba(40, 100, 189, .10);
        }

        .professor-page form textarea {
            resize: vertical;
            min-height: 130px;
        }

        .professor-page form button {
            width: fit-content;
            min-width: 180px;
            padding: 12px 20px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background: #2056a5;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s, transform .2s;
        }

        .professor-page form button:hover {
            background: #17447f;
            transform: translateY(-1px);
        }

        .professor-page form button:active {
            transform: translateY(0);
        }

        .professor-page #adicionarPergunta {
            background: #fff;
            color: #2056a5;
            border: 1px solid #2056a5;
        }

        .professor-page #adicionarPergunta:hover {
            background: #edf4ff;
        }

        .professor-page #publicarQuiz {
            background: #f28c28;
            color: #fff;
            margin-top: 18px;
        }

        .professor-page #publicarQuiz:hover {
            background: #dc7414;
        }

        .professor-page .quiz-divider {
            border: 0;
            border-top: 1px solid #e5eaf2;
            margin: 25px 0 18px;
        }

        .professor-page .questions-heading {
            color: #173b75;
            font-size: 18px;
            margin: 0 0 8px;
        }

        .professor-page .questions-description {
            color: #748096;
            font-size: 13px;
            margin: 0 0 12px;
        }

        .professor-page #listaPerguntas {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 8px;
        }

        .professor-page #listaPerguntas > div {
            padding: 20px;
            border: 1px solid #e0e7f0;
            border-radius: 10px;
            background: #f8faff;
        }

        .professor-page #mensagem,
        .professor-page #mensagemQuiz {
            margin-top: 15px;
            font-weight: 600;
        }

        @media (max-width: 700px) {
            .professor-page .work-container {
                padding: 18px;
            }

            .professor-page .professor-header {
                align-items: flex-start;
            }

            .professor-page form button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <aside class="sidebar">
        <h2>Conecta <span>ADS</span></h2>

        <nav>
            <a href="painel-professor.html" class="active">Painel</a>
            <a href="estudos.html">Estudos</a>
        </nav>

        <div class="sidebar-bottom">
            <a href="index.html" id="sair">Sair</a>
        </div>
    </aside>

    <main class="main-content professor-page">

        <header class="professor-header">
            <div>
                <h1>Área do Professor</h1>
                <p>Compartilhe conhecimentos e acompanhe o aprendizado dos alunos.</p>
            </div>

            <div class="profile">👨‍🏫</div>
        </header>

        <!-- PUBLICAÇÃO DE CONTEÚDO -->
        <section class="section professor-section">

            <h2>Publicar conteúdo de estudo</h2>

            <div class="work-container">

                <form id="formConteudo">

                    <label for="disciplina">Disciplina</label>
                    <select id="disciplina" required>
                        <option value="">Selecione uma disciplina</option>
                        <option value="Sistemas Operacionais">Sistemas Operacionais</option>
                        <option value="Lógica e Matemática Computacional">Lógica e Matemática Computacional</option>
                        <option value="Modelagem de Dados">Modelagem de Dados</option>
                    </select>

                    <label for="titulo">Título do conteúdo</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Digite o título do conteúdo"
                        required
                    >

                    <label for="resumo">Resumo</label>
                    <textarea
                        id="resumo"
                        rows="8"
                        placeholder="Escreva o conteúdo que deseja compartilhar..."
                        required
                    ></textarea>

                    <button type="submit">Publicar conteúdo</button>

                </form>

                <p id="mensagem"></p>

            </div>
        </section>

        <!-- CRIAÇÃO DE QUIZ -->
        <section class="section professor-section">

            <h2>Criar Quiz</h2>

            <div class="work-container">

                <form id="formQuiz">

                    <label for="disciplinaQuiz">Disciplina</label>
                    <select id="disciplinaQuiz" required>
                        <option value="">Selecione uma disciplina</option>
                        <option value="1">Sistemas Operacionais</option>
                        <option value="2">Lógica e Matemática Computacional</option>
                        <option value="3">Modelagem de Dados</option>
                    </select>

                    <label for="tituloQuiz">Título do quiz</label>
                    <input
                        type="text"
                        id="tituloQuiz"
                        placeholder="Ex: Revisão de Sistemas Operacionais"
                        required
                    >

                    <hr class="quiz-divider">

                    <h3 class="questions-heading">Cadastrar perguntas</h3>

                    <p class="questions-description">
                        Adicione as perguntas, as alternativas e indique a resposta correta.
                    </p>

                    <div id="listaPerguntas"></div>

                    <button type="button" id="adicionarPergunta">
                        + Adicionar pergunta
                    </button>

                    <button type="submit" id="publicarQuiz">
                        Publicar quiz
                    </button>

                </form>

                <p id="mensagemQuiz"></p>

            </div>
        </section>

    </main>
</div>

<script src="painel-professor.js"></script>

</body>
</html>
