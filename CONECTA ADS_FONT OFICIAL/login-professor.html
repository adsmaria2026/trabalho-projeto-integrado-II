
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Professor - Conecta ADS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Área do Professor</h1>
        <p>Entre para compartilhar conteúdos com seus alunos.</p>

        <form id="formLoginProfessor">
            <label for="email">E-mail</label>
            <input type="email" id="email" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" required>

            <button type="submit">Entrar</button>
        </form>

        <p id="mensagem"></p>

        <p>
            Ainda não tem cadastro?
            <a href="cadastro-professor.html">Cadastre-se aqui</a>
        </p>
    </main>

    <script src="login-professor.js"></script>
</body>
</html>
