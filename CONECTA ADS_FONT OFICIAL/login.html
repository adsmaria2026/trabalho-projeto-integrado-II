
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Conecta ADS</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Conecta <span>ADS</span></h1>
            <p>Entre na sua conta</p>

            <form onsubmit="event.preventDefault(); fazerLogin();">
                <label for="ra">RA do aluno</label>
                <input
                    type="text"
                    id="ra"
                    placeholder="Digite seu RA"
                    autocomplete="username"
                    required
                >

                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">
                    Entrar
                </button>
            </form>

            <p class="register-link">
                Ainda não tem uma conta?
                <a href="cadastro.html">Cadastre-se</a>
            </p>
        </div>
    </div>

    <script>
        async function fazerLogin() {
            const ra = document.querySelector("#ra").value.trim();
            const senha = document.querySelector("#senha").value;

            if (!ra || !senha) {
                alert("Preencha o RA e a senha!");
                return;
            }

            try {
                const resposta = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        ra: ra,
                        senha: senha
                    })
                });

                const resultado = await resposta.json();

                if (!resposta.ok) {
                    alert(resultado.mensagem);
                    return;
                }

                localStorage.setItem(
                    "alunoLogado",
                    JSON.stringify(resultado.aluno)
                );

                alert("Login realizado com sucesso!");

                window.location.href = "index.html";

            } catch (erro) {
                console.error("Erro no login:", erro);

                alert(
                    "Não foi possível conectar ao servidor. " +
                    "Verifique se o servidor está iniciado."
                );
            }
        }
    </script>
</body>
</html>
