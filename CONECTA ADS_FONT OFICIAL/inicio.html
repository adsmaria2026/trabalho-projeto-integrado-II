
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - Conecta ADS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>Conecta <span>ADS</span></h2>

            <nav>
                <a href="inicio.html" class="active">🏠 Início</a>
                <a href="estudos.html">📚 Estudos</a>
                <a href="trabalhos.html">📄 Trabalhos</a>
                <a href="quiz.html">📝 Quiz</a>
                <a href="perfil.html">👤 Meu perfil</a>
            </nav>

            <div class="sidebar-bottom">
                <a href="#">⚙️ Configurações</a>
                <a href="index.html" id="sair">🚪 Sair</a>
            </div>
        </aside>

        <main class="main-content">
            <header>
                <div>
                    <h1>Olá, estudante!</h1>
                    <p>Aprenda, compartilhe e evolua.</p>
                </div>
                <div class="profile">👤</div>
            </header>

            <section class="section">
                <h2>Bem-vindo ao Conecta ADS!</h2>
                <p>
                    Um espaço colaborativo para compartilhar conhecimentos,
                    acessar materiais de estudo e aprender com outros estudantes.
                </p>
            </section>
        </main>
    </div>

    <script>
        const alunoSalvo = localStorage.getItem("alunoLogado");

        if (!alunoSalvo) {
            window.location.href = "login.html";
        }

     document.getElementById("sair").addEventListener("click", function(event) {
    event.preventDefault();
    localStorage.removeItem("alunoLogado");
    window.location.href = "index.html";
});
    </script>
</body>
</html>
